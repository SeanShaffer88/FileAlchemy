name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish x64 artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      # The engines are pinned by SHA256 in engines.lock.json. This step fails
      # on purpose if a hash has not been reviewed - we never ship an unverified
      # third-party binary.
      - name: Fetch pinned engines (ffmpeg, pandoc, poppler)
        shell: pwsh
        run: ./scripts/fetch-engines.ps1

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Build tests
        run: cargo test --all-targets

      - name: Package (Setup.exe, Setup.msi, Portable.zip, SHA256SUMS.txt)
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify artifact set
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $expected = @(
            "FileAlchemy-v$version-x64-Setup.exe",
            "FileAlchemy-v$version-x64-Setup.msi",
            "FileAlchemy-v$version-x64-Portable.zip",
            "SHA256SUMS.txt"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path "dist/$name")) { throw "Missing artifact: $name" }
          }
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FileAlchemy-${{ steps.version.outputs.version }}-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $notes = @"
          Offline, portable universal file converter for Windows 11 / Windows 10 1903+.

          * `FileAlchemy-v${{ steps.version.outputs.version }}-x64-Setup.exe` — per-user installer (no admin prompt)
          * `FileAlchemy-v${{ steps.version.outputs.version }}-x64-Setup.msi` — per-user MSI for managed deployment
          * `FileAlchemy-v${{ steps.version.outputs.version }}-x64-Portable.zip` — unzip anywhere, state stays in `.\data\`
          * `SHA256SUMS.txt` — verify downloads with `certutil -hashfile <file> SHA256`

          No telemetry, no network access, no account.
          "@
          gh release create $tag dist/* --title "FileAlchemy ${{ steps.version.outputs.version }}" --notes $notes
