[package]
name = "filealchemy"
version = "1.0.0"
edition = "2021"
rust-version = "1.79"
description = "FileAlchemy - offline, portable universal file converter for Windows"
authors = ["Sean Shaffer"]
license = "MIT"
publish = false
default-run = "FileAlchemy"

[[bin]]
name = "FileAlchemy"
path = "src/main.rs"

[dependencies]
# ---- UI -------------------------------------------------------------------
slint = { version = "1.8", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    # Without this the software renderer uses Slint's bundled fallback font
    # instead of Segoe UI, and CJK/Hebrew/Arabic text does not render at all.
    "software-renderer-systemfonts",
    "compat-1-2",
    "accessibility",
] }

# ---- Win32 platform layer -------------------------------------------------
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# ---- Conversion engines ---------------------------------------------------
infer = "0.16"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "qoi",
    "rayon",
    "tiff",
    "webp",
] }
# `text` renders SVG <text>; `system-fonts` makes that text actually visible;
# `raster-images` renders <image> inside SVGs. All pure Rust.
resvg = { version = "0.44", default-features = false, features = [
    "text",
    "system-fonts",
    "raster-images",
] }
tiny-skia = "0.11"
ravif = "0.11"
# `imgref` is ravif's public image container type; the version must unify with
# the one ravif links against.
imgref = "1.9"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
sevenz-rust = "0.6"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rayon = "1.10"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
